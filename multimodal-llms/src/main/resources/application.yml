server:
  port: 8083
  servlet:
    context-path: /springai
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:${OPENAI_KEY}}
      chat: # By default its true, this triggers the autoconfiguration.
        options:
          model: gpt-4.1
          temperature: 1.0
          max_completion_tokens: 2000
      image:
        api-key: ${OPENAI_API_KEY:${OPENAI_KEY}}
        options:
          model: gpt-image-1
          quality: medium
          height: 1024
          width: 1024
      audio:
        speech:
          options:
            model: tts-1
            voice: alloy #lloy, ash, ballad, coral, echo, fable, onyx, nova, sage, shimmer, verse, marin, and cedar
            speed: 1.0
            response_format: mp3
        transcription:
          options:
            model: whisper-1
            prompt: Extract text from the audio file.
#            response_format: verbose_json
#            temperature: 0.0
#            language: en



